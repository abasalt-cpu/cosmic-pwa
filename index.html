<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#161233">
<title>کد کیهانی</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg-top:#161233; --bg-bottom:#2b1a4a; --panel:#231a42cc; --gold:#e8b84b; --gold-soft:#f0c96a;
--text:#f1eef9; --text-dim:#b9b0d6; --line:#3d3268; --radius:18px; font-family: Tahoma, sans-serif;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:radial-gradient(1200px 800px at 15% -10%, #3a2a63 0%, transparent 60%),
radial-gradient(900px 700px at 100% 0%, #402458 0%, transparent 55%),
linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 70%); color:var(--text); min-height:100vh; padding-bottom:calc(64px + env(safe-area-inset-bottom)); overflow-x:hidden;}
.stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
background-image:radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
radial-gradient(1px 1px at 90px 120px, #fff, transparent),
radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent),
radial-gradient(1px 1px at 210px 180px, #fff, transparent),
radial-gradient(1.5px 1.5px at 260px 40px, #fff, transparent),
radial-gradient(1px 1px at 320px 150px, #fff, transparent);
background-repeat:repeat; background-size:360px 220px;}
header.top{position:relative; z-index:1; padding:14px 16px 10px; text-align:center;}
.top-bar{position:relative; display:flex; align-items:center; justify-content:space-between; padding-bottom:10px;}
.top-bar::after{content:''; position:absolute; left:12%; right:12%; bottom:0; height:1px;
background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent); opacity:.55;}
.brand-inline{flex:1; font-size:20px; font-weight:800; letter-spacing:.3px;
background:linear-gradient(90deg, var(--gold-soft), #fff6de 50%, var(--gold-soft));
-webkit-background-clip:text; background-clip:text; color:transparent;}
.icon-btn{position:relative; width:36px; height:36px; border-radius:12px; border:none; line-height:1;
background:transparent; color:var(--text); display:inline-flex; align-items:center; justify-content:center;
font-size:18px; cursor:pointer; padding:0; flex-shrink:0;}
.icon-btn:active{transform:scale(.94);}
.icon-btn .dot{position:absolute; top:5px; inset-inline-end:6px; width:8px; height:8px; border-radius:50%;
background:var(--gold); box-shadow:0 0 0 2px #161233;}
header.top .sub{color:var(--text-dim); font-size:12.5px; margin-top:10px;}
main{position:relative; z-index:1; padding:6px 16px 8px; max-width:520px; margin:0 auto;}
.card{background:linear-gradient(180deg, var(--panel), #1c1538cc); border:1px solid var(--line); border-radius:var(--radius);
padding:18px 16px; margin-bottom:14px; backdrop-filter: blur(6px);}
main .card:last-child{margin-bottom:0;}
.card h2{margin:0 0 10px; font-size:16px; color:var(--gold-soft); font-weight:700;}
.card p.desc{color:var(--text-dim); font-size:13px; margin:0 0 12px; line-height:1.9;}
.welcome-card{display:flex; align-items:center; gap:14px;}
.welcome-card .w-text{flex:1; text-align:right;}
.welcome-card .w-text h2{margin:0 0 6px;}
.welcome-icon{flex-shrink:0; width:100px; height:100px; border-radius:50%; overflow:hidden; position:relative;
background:radial-gradient(circle at 42% 32%, #3d2c6b, #1a1436 70%); border:1px solid var(--line);
box-shadow:0 0 0 1px #ffffff08 inset, 0 0 24px #7c4fe044;}
.welcome-icon img{width:100%; height:100%; object-fit:cover; display:block;}
.grid-menu{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.menu-tile{background:linear-gradient(160deg, #2a1f4d, #1c1538); border:1px solid var(--line); border-radius:16px;
padding:14px 6px; text-align:center; cursor:pointer; transition:transform .15s ease;}
.menu-tile:active{transform:scale(.96);}
.menu-tile .emoji{font-size:24px; display:block; margin-bottom:8px;}
.menu-tile .label{font-size:12.5px; font-weight:700; display:block;}
.menu-tile .desc{font-size:10.5px; color:var(--text-dim); display:block; margin-top:4px; line-height:1.6;}
.menu-tile.gold{border-color:var(--gold); box-shadow:0 0 0 1px #e8b84b33 inset;}
.menu-tile .icon-img{width:80px; height:80px; border-radius:14px; display:block; margin:0 auto 8px; object-fit:cover; box-shadow:0 4px 14px #00000055;}
.brand-icon{width:34px; height:34px; border-radius:9px; vertical-align:middle; margin-inline-end:8px; object-fit:cover;}
.banner-card{display:flex; align-items:center; gap:10px; border-radius:30px; padding:16px 18px;}
.banner-card .b-icon{flex-shrink:0; width:44px; height:44px; border-radius:50%; display:flex; align-items:center;
justify-content:center; font-size:20px; background:radial-gradient(circle at 40% 35%, #3d2c6b, #1a1436 75%);
box-shadow:0 0 18px #7c4fe055, 0 0 0 1px #ffffff08 inset;}
.banner-card .b-text{flex:1; text-align:center; font-size:12.5px; line-height:1.9;}
.banner-card .b-text .hi{color:var(--gold-soft);}
.list-item{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--line);
cursor:pointer; font-size:14px;}
.list-item:last-child{border-bottom:none;}
.list-item .li-label{display:flex; align-items:center; gap:10px;}
.list-item .li-arrow{color:var(--text-dim); font-size:13px;}

label{display:block; font-size:13px; color:var(--text-dim); margin:12px 0 6px;}
input[type=text], input[type=number], select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
background:#140f28; color:var(--text); font-size:15px; font-family:inherit;}
input:focus, select:focus{outline:2px solid var(--gold); border-color:var(--gold);}
.btn{display:inline-block; width:100%; text-align:center; padding:13px 16px; border-radius:14px; border:none;
background:linear-gradient(90deg, var(--gold), var(--gold-soft)); color:#241a08; font-weight:800; font-size:14.5px; cursor:pointer; margin-top:14px;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:transparent; color:var(--gold-soft); border:1px solid var(--gold);}
.btn.small{width:auto; padding:9px 14px; font-size:13px; margin-top:8px;}
.btn-row{display:flex; gap:10px; margin-top:14px;}
.btn-row .btn{margin-top:0;}
.back-btn{display:inline-flex; align-items:center; gap:6px; color:var(--gold-soft); font-size:13px; margin-bottom:10px;
cursor:pointer; background:none; border:none; padding:6px 0; font-family:inherit;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{padding:9px 14px; border-radius:20px; border:1px solid var(--line); background:#1a1436; color:var(--text); font-size:13px; cursor:pointer;}
.chip.active{background:var(--gold); color:#241a08; border-color:var(--gold); font-weight:700;}
.result-block{border-top:1px dashed var(--line); padding-top:12px; margin-top:12px; font-size:14px; line-height:2;}
.result-block .num{color:var(--gold-soft); font-weight:700;}
.result-block .verse{font-style:italic; color:#e7e0ff;}
.code{direction:ltr; text-align:center; font-size:15px; letter-spacing:1px; background:#0f0b21; border:1px solid var(--line);
border-radius:10px; padding:10px; margin:8px 0; color:var(--gold-soft); word-break:break-all;}
.verse{font-style:italic; color:#e7e0ff;}
.name-item{padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
nav.bottom{position:fixed; bottom:0; inset-inline:0; z-index:5; background:#150f2ce6; backdrop-filter:blur(10px);
border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
nav.bottom .nav-btn{background:none; border:none; color:var(--text-dim); font-family:inherit; display:flex; flex-direction:column;
align-items:center; gap:2px; font-size:9.5px; padding:4px 4px; cursor:pointer; flex:1; min-width:0; white-space:nowrap;}
nav.bottom .nav-btn .ic{font-size:18px; display:inline-flex; width:22px; height:22px;}
nav.bottom .nav-btn .ic svg{width:100%; height:100%;}
nav.bottom .nav-btn.active .ic svg{filter:drop-shadow(0 0 4px #e8b84b99);}
nav.bottom .nav-btn.active{color:var(--gold-soft);}
.small-note{font-size:11.5px; color:var(--text-dim); margin-top:10px; line-height:1.8;}
::selection{background:var(--gold); color:#241a08;}
</style>
</head>
<body>
<div class="stars"></div>
<header class="top">
  <div class="top-bar">
    <button class="icon-btn" onclick="showNotifications()" aria-label="اعلان‌ها">🔔<span class="dot"></span></button>
    <div class="brand-inline">✨ کد کیهانی ✨</div>
    <button class="icon-btn" onclick="showMoreMenu()" aria-label="منو">☰</button>
  </div>
  <div class="sub">عددشناسی، طالع‌بینی و الهام‌های روزانه</div>
</header>
<main id="app"></main>
<nav class="bottom">
  <button class="nav-btn active" data-nav="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.2V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8.8"/><path d="M10 20v-5h4v5"/><circle cx="12" cy="2" r=".9" fill="currentColor" stroke="none"/></svg></span>خانه</button>
  <button class="nav-btn" data-nav="cosmic"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M8.7 12c0-1.5 1.15-2.5 2.35-1.75 1.05.65 1.05 2.85 0 3.5-1.2.75-2.35-.25-2.35-1.75Z"/><path d="M15.3 12c0-1.5-1.15-2.5-2.35-1.75-1.05.65-1.05 2.85 0 3.5 1.2.75 2.35-.25 2.35-1.75Z"/></svg></span>کد کیهانی</button>
  <button class="nav-btn" data-nav="profiles"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.3" y="5" width="17.4" height="14" rx="2.6"/><circle cx="9" cy="11" r="2"/><path d="M6 16.2c.6-1.9 2-2.7 3-2.7s2.4.8 3 2.7"/><path d="M14.5 10h4M14.5 13h3"/></svg></span>پروفایل‌های من</button>
  <button class="nav-btn" data-nav="more"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v3.4M12 17.4v3.4M3.2 12h3.4M17.4 12h3.4M5.8 5.8l2.4 2.4M15.8 15.8l2.4 2.4M18.2 5.8l-2.4 2.4M8.2 15.8l-2.4 2.4"/><circle cx="12" cy="12" r="2.6"/></svg></span>بیشتر</button>
</nav>
<script src="data/data.js"></script>
<script src="data/tables.js"></script>
<script src="js/cosmic_logic.js"></script>
<script src="js/natal_chart.js"></script>
<script src="js/zodiac.js"></script>
<script src="js/content_modules.js"></script>
<script src="js/baby_name.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
</script>
</body>
</html>
