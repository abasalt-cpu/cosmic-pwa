<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#161233">
<title>کد کیهانی</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg-top:#161233; --bg-bottom:#2b1a4a; --panel:#231a42cc; --gold:#e8b84b; --gold-soft:#f0c96a;
--text:#f1eef9; --text-dim:#b9b0d6; --line:#3d3268; --radius:18px; font-family: 'Vazirmatn', Tahoma, sans-serif;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{background:radial-gradient(1200px 800px at 15% -10%, #3a2a63 0%, transparent 60%),
radial-gradient(900px 700px at 100% 0%, #402458 0%, transparent 55%),
linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 70%); color:var(--text); min-height:100vh; padding-bottom:calc(96px + env(safe-area-inset-bottom)); overflow-x:hidden;}
.stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
background-image:radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
radial-gradient(1px 1px at 90px 120px, #fff, transparent),
radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent),
radial-gradient(1px 1px at 210px 180px, #fff, transparent),
radial-gradient(1.5px 1.5px at 260px 40px, #fff, transparent),
radial-gradient(1px 1px at 320px 150px, #fff, transparent);
background-repeat:repeat; background-size:360px 220px;}
header.top{position:relative; z-index:1; padding:22px 20px 14px; text-align:center;}
header.top .brand{font-size:22px; font-weight:800; letter-spacing:.5px;
background:linear-gradient(90deg, var(--gold-soft), #fff6de 50%, var(--gold-soft));
-webkit-background-clip:text; background-clip:text; color:transparent;}
header.top .sub{color:var(--text-dim); font-size:12.5px; margin-top:4px;}
main{position:relative; z-index:1; padding:6px 16px 24px; max-width:520px; margin:0 auto;}

/* ۱. گرید ۳ ستونه */
.grid-menu{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}

/* ۲. کارت‌های منو (عنوان و زیرعنوان) */
.menu-tile{background:linear-gradient(160deg, #2a1f4d, #1c1538); border:1px solid var(--line); border-radius:18px;
padding:14px 6px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-height:120px;}
.menu-tile:active{transform:scale(.96);}
.menu-tile .icon-placeholder{width:44px; height:44px; margin-bottom:8px;}
.menu-tile .label{font-size:12.5px; font-weight:700; color:#fff; margin-bottom:3px;}
.menu-tile .sub-label{font-size:10px; color:var(--text-dim); font-weight:400; line-height:1.2;}

/* ۳. کارت بنر انتهای صفحه */
.bottom-banner{background:linear-gradient(180deg, #261942, #1a1336); border:1px solid var(--line); border-radius:18px;
padding:14px 16px; margin-top:12px; text-align:center;}
.bottom-banner .banner-title{font-size:12px; color:#e7e0ff; font-weight:600;}
.bottom-banner .banner-sub{font-size:10.5px; color:var(--text-dim); margin-top:4px;}

nav.bottom{position:fixed; bottom:0; inset-inline:0; z-index:5; background:#150f2ce6; backdrop-filter:blur(10px);
border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
nav.bottom .nav-btn{background:none; border:none; color:var(--text-dim); font-family:inherit; display:flex; flex-direction:column;
align-items:center; gap:2px; font-size:10.5px; padding:4px 8px; cursor:pointer;}
nav.bottom .nav-btn .ic{font-size:19px;}
nav.bottom .nav-btn.active{color:var(--gold-soft);}
</style>
</head>
<body>
<div class="stars"></div>
<header class="top"><div class="brand"><img src="icons/icon-192.png" class="brand-icon"> کد کیهانی</div><div class="sub">عددشناسی، طالع‌بینی و الهام‌های روزانه</div></header>
<main id="app"></main>
<nav class="bottom">
  <button class="nav-btn active" data-nav="home"><span class="ic">🏠</span>خانه</button>
  <button class="nav-btn" data-nav="cosmic"><span class="ic">🔢</span>کد کیهانی</button>
  <button class="nav-btn" data-nav="daily"><span class="ic">🔮</span>پروفایل های من</button>
  <button class="nav-btn" data-nav="more"><span class="ic">✨</span>بیشتر</button>
</nav>
<script src="data/data.js"></script>
<script src="data/tables.js"></script>
<script src="js/cosmic_logic.js"></script>
<script src="js/natal_chart.js"></script>
<script src="js/zodiac.js"></script>
<script src="js/content_modules.js"></script>
<script src="js/baby_name.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
</script>
</body>
</html>
