<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#161233">
<title>کد کیهانی</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg-top:#161233; --bg-bottom:#2b1a4a; --panel:#231a42cc; --gold:#e8b84b; --gold-soft:#f0c96a;
--text:#f1eef9; --text-dim:#b9b0d6; --line:#3d3268; --radius:18px; font-family: Tahoma, sans-serif;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:radial-gradient(1200px 800px at 15% -10%, #3a2a63 0%, transparent 60%),
radial-gradient(900px 700px at 100% 0%, #402458 0%, transparent 55%),
linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 70%); color:var(--text); min-height:100vh; padding-bottom:calc(64px + env(safe-area-inset-bottom)); overflow-x:hidden;}
.stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
background-image:radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
radial-gradient(1px 1px at 90px 120px, #fff, transparent),
radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent),
radial-gradient(1px 1px at 210px 180px, #fff, transparent),
radial-gradient(1.5px 1.5px at 260px 40px, #fff, transparent),
radial-gradient(1px 1px at 320px 150px, #fff, transparent);
background-repeat:repeat; background-size:360px 220px;}
header.top{position:fixed; top:0; inset-inline:0; z-index:10; padding:14px 16px 10px; text-align:center;
background:linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 400%); backdrop-filter:blur(10px);}
.top-bar{position:relative; display:flex; align-items:center; justify-content:space-between; padding-bottom:10px;}
.top-bar::after{content:''; position:absolute; left:12%; right:12%; bottom:0; height:1px;
background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent); opacity:.55;}
.brand-inline{flex:1; font-size:20px; font-weight:800; letter-spacing:.3px;
background:linear-gradient(90deg, var(--gold-soft), #fff6de 50%, var(--gold-soft));
-webkit-background-clip:text; background-clip:text; color:transparent;}
.icon-btn{position:relative; width:36px; height:36px; border-radius:12px; border:none; line-height:1;
background:transparent; color:var(--text); display:inline-flex; align-items:center; justify-content:center;
font-size:18px; cursor:pointer; padding:0; flex-shrink:0;}
.icon-btn:active{transform:scale(.94);}
.icon-btn .dot{position:absolute; top:5px; inset-inline-end:6px; width:8px; height:8px; border-radius:50%;
background:var(--gold); box-shadow:0 0 0 2px #161233;}
header.top .sub{color:var(--text-dim); font-size:12.5px; margin-top:10px;}
main{position:relative; z-index:1; padding:calc(var(--header-h, 100px) + 6px) 16px 8px; max-width:520px; margin:0 auto;}
.card{background:linear-gradient(180deg, var(--panel), #1c1538cc); border:1px solid var(--line); border-radius:var(--radius);
padding:18px 16px; margin-bottom:14px; backdrop-filter: blur(6px);}
main .card:last-child{margin-bottom:0;}
.card h2{margin:0 0 10px; font-size:16px; color:var(--gold-soft); font-weight:700;}
.card p.desc{color:var(--text-dim); font-size:13px; margin:0 0 12px; line-height:1.9;}
.welcome-card{position:relative; border-color:var(--gold) !important;
box-shadow:0 0 0 1px #e8b84b90, 0 0 28px 2px #e8b84b3a, inset 0 0 24px #e8b84b14;}
.wc-full{display:flex; align-items:center; gap:14px;}
.wc-full .w-text{flex:1; text-align:right;}
.wc-full .w-text h2{margin:0 0 6px;}
.wc-full .w-text .desc b{color:#4fd17a;}
.welcome-icon-wrap{position:relative; flex-shrink:0; width:100px; height:100px;}
.welcome-icon-wrap::before{content:''; position:absolute; inset:-10px; border-radius:50%; border:1px solid #e8b84b4a; z-index:1;}
.welcome-icon-wrap::after{content:''; position:absolute; inset:-18px; border-radius:50%; border:1px solid #e8b84b28; z-index:1;}
.orbit-dot{position:absolute; width:6px; height:6px; border-radius:50%; background:var(--gold-soft); box-shadow:0 0 8px 2px #f0c96a99; z-index:2;}
.orbit-dot.d1{top:-15px; left:16px;}
.orbit-dot.d2{top:36%; right:-19px;}
.orbit-dot.d3{bottom:-6px; left:-13px;}
.welcome-icon{width:100%; height:100%; border-radius:50%; overflow:hidden; position:relative; z-index:2;
background:radial-gradient(circle at 42% 32%, #3d2c6b, #1a1436 70%);
box-shadow:0 0 0 1.5px #e8b84b90, 0 0 16px #e8b84b55, inset 0 0 14px #e8b84b1f;}
.welcome-icon img{width:100%; height:100%; object-fit:cover; display:block;}
.btn-inner{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;}
.btn-badge{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%;
background:#1a1030; border:3px solid var(--gold); box-shadow:0 0 8px #e8b84b80; color:#f6d896; flex-shrink:0;}
.btn-badge svg{width:23px; height:23px; margin:0 !important; vertical-align:middle !important;}
.icon-calc-glyph{font-size:19px; font-weight:900; line-height:1; display:inline-block; vertical-align:middle !important; margin:0 !important;}
.btn-chevron{display:inline-block; opacity:.65; font-size:15px; flex-shrink:0;}
.wc-mini-bar{position:fixed; top:calc(var(--header-h, 100px) + 8px); left:0; right:0; z-index:9; max-width:520px; margin:0 auto;
display:flex; align-items:center; gap:10px; padding:8px 14px; background:linear-gradient(180deg, var(--panel), #1c1538cc);
border:1px solid var(--gold); box-shadow:0 0 0 1px #e8b84b70, 0 0 20px #e8b84b3a, 0 6px 20px #00000066;
border-radius:999px;
opacity:0; transform:translateY(-10px); pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
.wc-mini-bar.is-visible{opacity:1; transform:translateY(0); pointer-events:auto;}
.wc-last{flex:1; font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wc-last b{color:#4fd17a;}
.wc-mini-btn{width:auto !important; margin-top:0 !important; padding:8px 14px !important; font-size:12.5px !important; border-radius:999px !important; flex-shrink:0;}
.wc-mini-hand{border-radius:50%; object-fit:cover; flex-shrink:0; cursor:pointer;
border:1px solid var(--line); box-shadow:0 0 12px #7c4fe044;}
.google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; max-width:280px;
margin:0 auto; padding:12px 20px; border-radius:999px; background:#1f1f1f; color:#fff; border:1px solid #55585a;
font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;}
.google-btn:active{opacity:.85;}
.grid-menu{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.menu-tile{background:linear-gradient(160deg, #2a1f4d, #1c1538); border:1px solid var(--line); border-radius:16px;
padding:14px 6px; text-align:center; cursor:pointer; transition:transform .15s ease;}
.menu-tile:active{transform:scale(.96);}
.menu-tile .emoji{font-size:24px; display:block; margin-bottom:8px;}
.menu-tile .label{font-size:12.5px; font-weight:700; display:block;}
.menu-tile .desc{font-size:10.5px; color:var(--text-dim); display:block; margin-top:4px; line-height:1.6;}
.menu-tile.gold{border-color:var(--gold); box-shadow:0 0 0 1px #e8b84b33 inset;}
.menu-tile .icon-img{width:80px; height:80px; border-radius:14px; display:block; margin:0 auto 8px; object-fit:cover; box-shadow:0 4px 14px #00000055;}
.brand-icon{width:34px; height:34px; border-radius:9px; vertical-align:middle; margin-inline-end:8px; object-fit:cover;}
.banner-card{display:flex; align-items:center; gap:10px; border-radius:30px; padding:16px 18px;}
.banner-card .b-icon{flex-shrink:0; width:44px; height:44px; border-radius:50%; display:flex; align-items:center;
justify-content:center; font-size:20px; background:radial-gradient(circle at 40% 35%, #3d2c6b, #1a1436 75%);
box-shadow:0 0 18px #7c4fe055, 0 0 0 1px #ffffff08 inset;}
.banner-card .b-text{flex:1; text-align:center; font-size:12.5px; line-height:1.9;}
.banner-card .b-text .hi{color:var(--gold-soft);}
.list-item{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--line);
cursor:pointer; font-size:14px;}
.list-item:last-child{border-bottom:none;}
.list-item .li-label{display:flex; align-items:center; gap:10px;}
.list-item .li-arrow{color:var(--text-dim); font-size:13px;}

label{display:block; font-size:13px; color:var(--text-dim); margin:12px 0 6px;}
input[type=text], input[type=number], select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
background:#140f28; color:var(--text); font-size:15px; font-family:inherit;}
input:focus, select:focus{outline:2px solid var(--gold); border-color:var(--gold);}
.btn{display:inline-block; width:100%; text-align:center; padding:13px 16px; border-radius:14px; border:none;
background:linear-gradient(180deg, #f6d581, var(--gold) 55%, #d9a53a); color:#241a08; font-weight:800; font-size:14.5px; cursor:pointer; margin-top:14px;
position:relative; box-shadow:0 3px 0 #a97c1f, 0 6px 16px #00000055, inset 0 1px 0 #ffffffa0;}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #a97c1f, 0 3px 10px #00000055, inset 0 1px 0 #ffffffa0;}
.btn.secondary{background:transparent; color:var(--gold-soft); border:1px solid var(--gold); box-shadow:none;}
.btn.secondary:active{box-shadow:none; transform:scale(.98);}
.btn.small{width:auto; padding:9px 14px; font-size:13px; margin-top:8px;}
.btn-row{display:flex; gap:10px; margin-top:14px;}
.btn-row .btn{margin-top:0;}
.back-btn{display:inline-flex; align-items:center; gap:6px; color:var(--gold-soft); font-size:13px; margin-bottom:10px;
cursor:pointer; background:none; border:none; padding:6px 0; font-family:inherit;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{padding:9px 14px; border-radius:20px; border:1px solid var(--line); background:#1a1436; color:var(--text); font-size:13px; cursor:pointer;}
.chip.active{background:var(--gold); color:#241a08; border-color:var(--gold); font-weight:700;}
.result-block{border-top:1px dashed var(--line); padding-top:12px; margin-top:12px; font-size:14px; line-height:2;}
.result-block .num{color:var(--gold-soft); font-weight:700;}
.result-block .verse{font-style:italic; color:#e7e0ff;}
.code{direction:ltr; text-align:center; font-size:15px; letter-spacing:1px; background:#0f0b21; border:1px solid var(--line);
border-radius:10px; padding:10px; margin:8px 0; color:var(--gold-soft); word-break:break-all;}
.verse{font-style:italic; color:#e7e0ff;}
.name-item{padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
nav.bottom{position:fixed; bottom:0; inset-inline:0; z-index:5; background:#150f2ce6; backdrop-filter:blur(10px);
border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
nav.bottom .nav-btn{background:none; border:none; color:var(--text-dim); font-family:inherit; display:flex; flex-direction:column;
align-items:center; gap:2px; font-size:9.5px; padding:4px 4px; cursor:pointer; flex:1; min-width:0; white-space:nowrap;}
nav.bottom .nav-btn .ic{font-size:18px; display:inline-flex; width:22px; height:22px;}
nav.bottom .nav-btn .ic svg{width:100%; height:100%;}
nav.bottom .nav-btn.active .ic svg{filter:drop-shadow(0 0 4px #e8b84b99);}
nav.bottom .nav-btn.active{color:var(--gold-soft);}
.small-note{font-size:11.5px; color:var(--text-dim); margin-top:10px; line-height:1.8;}
::selection{background:var(--gold); color:#241a08;}
.balloon-overlay{position:fixed; inset:0; z-index:999; pointer-events:none; overflow:hidden;}
.balloon{position:absolute; bottom:-90px; animation-name:balloonRise; animation-timing-function:ease-in; animation-fill-mode:forwards;}
@keyframes balloonRise{0%{transform:translateY(0) rotate(-4deg);opacity:1;}50%{transform:translateY(-58vh) rotate(4deg);}85%{opacity:1;}100%{transform:translateY(-118vh) rotate(-4deg);opacity:0;}}
.balloon-msg{position:fixed; top:16%; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--gold);
color:var(--gold-soft); padding:12px 22px; border-radius:16px; font-size:14px; font-weight:700; box-shadow:0 8px 30px #0008;
animation:balloonMsgFade 7s ease forwards; text-align:center; max-width:88%; backdrop-filter:blur(6px);}
@keyframes balloonMsgFade{0%{opacity:0; transform:translateX(-50%) translateY(-10px);}10%{opacity:1; transform:translateX(-50%) translateY(0);}85%{opacity:1;}100%{opacity:0;}}
#splash-screen{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
flex-direction:column; background:linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 70%); transition:opacity .4s ease;}
#splash-screen.hide{opacity:0; pointer-events:none;}
.splash-logo{font-size:52px; margin-bottom:10px; animation:splashPulse 1.6s ease-in-out infinite;}
.splash-title{font-size:20px; font-weight:800; color:var(--gold-soft); letter-spacing:1px; font-family:inherit;}
@keyframes splashPulse{0%,100%{transform:scale(1); opacity:1;}50%{transform:scale(1.12); opacity:.75;}}
.hafez-mode{display:flex; gap:8px; margin:14px 0 6px;}
.hafez-mode .mode-opt{flex:1; text-align:center; padding:10px 8px; border:1px solid var(--line); border-radius:12px; cursor:pointer; font-size:13.5px; color:var(--text-dim);}
.hafez-mode .mode-opt.on{border-color:var(--gold); color:var(--gold-soft); background:#e8b84b18; font-weight:700;}
.hz-sec{margin:14px 0 4px; color:var(--gold-soft); font-size:14.5px;}

.center{text-align:center;}
.pg-head{text-align:center; margin:2px 0 16px;}
.pg-ic{font-size:46px; line-height:1.1; filter:drop-shadow(0 0 12px #8a5cffaa); margin-bottom:2px;}
.pg-title{margin:0; font-size:clamp(26px,9vw,36px); font-weight:800; line-height:1.6;
background:linear-gradient(180deg,#fff1c8,#e8b84b 58%,#b98324); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 8px #000a);}
.pg-title.sm{font-size:clamp(20px,6.5vw,26px);}
.pg-sub{color:var(--text-dim); font-size:13px; margin:6px 0 0; line-height:1.8;}
.orn-div{display:flex; align-items:center; gap:8px; justify-content:center; margin:6px auto; max-width:300px; color:var(--gold-soft); font-size:12px;}
.orn-div span{flex:1; height:1px; background:linear-gradient(90deg,transparent,#e8b84b,transparent);}
.pg-person{display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:17px; color:var(--gold-soft); margin:4px 0 2px;}
.back-btn{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--gold); padding:0; justify-content:center; margin-bottom:8px; background:#0b0d2a99;}
.back-btn svg{width:20px; height:20px;}
.icon-btn{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--gold); background:#0b0d2a99; color:var(--gold-soft);}
.brand-inline{font-family:'Cinzel',Georgia,serif; font-size:21px; letter-spacing:1.5px; font-weight:700;}
label{color:var(--gold-soft); font-weight:700; font-size:14px;}
input[type=text],input[type=number],input[type=email],input[type=password],select{background-color:#0b0d2a; border:1px solid #e8b84b66; border-radius:12px;}
input.ic-user{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23e8b84b%22%20stroke-width%3D%221.6%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%228%22%20r%3D%224%22%2F%3E%3Cpath%20d%3D%22M4%2021c1-4.5%204.5-6.5%208-6.5s7%202%208%206.5%22%2F%3E%3C%2Fsvg%3E"); background-repeat:no-repeat; background-position:right 14px center; background-size:20px; padding-inline-start:46px !important;}
.date-row{display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:8px; text-align:center;}
.date-row small{display:block; color:var(--text-dim); font-size:12px; margin-top:4px;}
.btn{border-radius:999px; font-size:16px; padding:14px 18px; border:1.5px solid #fbe3a1; background:linear-gradient(180deg,#fbe3a1,#e8b84b 55%,#c2902f);}
.btn.secondary{background:#0b0d2a99; border:1.5px solid var(--gold);}
.menu-tile{border:1px solid #e8b84b55; background:linear-gradient(160deg,#16193f,#0d0f2b);}
.verse{font-style:normal; text-align:center; font-size:16.5px; line-height:2.3; color:#f6efdc;}
.result-block{border-top:1px solid #e8b84b44;}
.result-block .btn.small{width:48%; margin:10px 1% 0;}
.hz-sec{color:var(--gold-soft); font-weight:800;}
.chip-row.two{display:flex; gap:10px;} .chip-row.two .chip{flex:1; text-align:center; padding:12px; border-radius:999px; border-color:var(--gold); font-weight:700;}
.big-time{font-size:34px; font-weight:800; color:var(--gold-soft); margin:6px 0; direction:rtl;}
.attrib{color:var(--gold-soft); font-size:13px; font-weight:700; margin:4px 0 14px;}
.count-chip{display:inline-block; border:1px solid var(--gold); border-radius:999px; padding:8px 26px; color:var(--gold-soft); font-weight:800; margin:0 auto 16px; background:#0b0d2acc;}
.en-line{direction:ltr; text-align:center; font-family:Georgia,serif; color:var(--gold-soft); line-height:1.9; font-size:17px; margin:0 0 14px;}
.code{direction:ltr; font-size:clamp(18px,6vw,26px); font-weight:800; letter-spacing:1px; background:transparent; border:none; color:var(--gold-soft); text-shadow:0 0 14px #e8b84b66; padding:14px 0; margin:0;}
.cr-name{text-align:center; font-size:20px; font-weight:800; margin:16px 0 0; color:#fff6de;}
.chips{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0 6px;}
.chip2{border:1px solid #e8b84b88; border-radius:999px; padding:6px 14px; font-size:12px; color:var(--text-dim); background:#0b0d2acc;}
.num-grid{display:grid; grid-template-columns:1fr 1fr; gap:26px 12px; margin:30px 0 8px;}
.num-card{position:relative; border:1px solid #e8b84b88; border-radius:14px; background:#0b0d2acc; padding:26px 10px 14px; text-align:center;}
.num-card .nc-ic{position:absolute; top:-18px; left:50%; transform:translateX(-50%); width:36px; height:36px; border-radius:50%; background:#0b0d2a; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:17px;}
.num-card.full{grid-column:1/-1;}
.num-card h4{margin:0 0 4px; color:var(--gold-soft); font-size:14px;}
.num-card .big{font-size:34px; font-weight:800; color:var(--gold-soft); line-height:1.3;}
.num-card p{font-size:12px; line-height:1.9; margin:6px 0 0; color:var(--text);}
</style>
</head>
